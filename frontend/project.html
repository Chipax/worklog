<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/main.css">

    <title>WorkLog</title>
    
</head>
<body>
    <header>
    <nav>
        <div class="app-title"><a href="index.html">WorkLog</a></div>

        <ul class="nav-link">
             <!-- Solo visible si inició sesión -->
            <li class="auth-only hidden"><a href="#">Perfil</a></li>
            <li class="auth-only hidden"><a href="#">Favoritos</a></li>
            <li class="btn-crear auth-only hidden"><a href="project.html">Crear Proyecto</a></li>
        </ul>

        <div class="nav-auth">
            <!-- Si NO ha iniciado sesión -->
            <div id="guest-menu" class="guest-only">
                <a href="login.html" class="login">Log in</a>
            </div>

            <!-- Si SI ha iniciado sesión -->
            <div id="user-menu" class="user-menu auth-only hidden">
                <span id="user-name" class="user-name"></span>
                <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
            </div>
        </div>
    </nav>
</header>

   <main>
        <h1>Nuevo Proyecto</h1>
        <div class="contenedor-creador">
            
            <div class="campos-proyecto">
                <div class="grupo-formulario">
                    <label for="project-title">Título del Proyecto</label>
                    <input type="text" id="project-title" placeholder="Ej. Sistema de Control de Horas" required>
                </div>

                <div class="grupo-formulario">
                    <label for="project-description">Descripción Breve</label>
                    <textarea id="project-description" placeholder="Escribe una pequeña descripción del proyecto..." rows="3"></textarea>
                </div>
                
            <div class="grupo-formulario">
                <label>Imagen de Portada / Adjuntos</label>
                <label for="project-image" id="dropzone-label" class="dropzone-label">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <span>Haz clic o arrastra una imagen aquí</span>
                    <small>Formatos soportados: PNG, JPG, WEBP (Máx. 5MB)</small>
                </label>
                <input type="file" id="project-image" accept="image/*" class="file-input-hidden">
                <p id="status-message"></p>
                <!-- Contenedor opcional para vista previa JS -->
                <div id="image-preview" class="image-preview" style = "display:none;"></div>
            </div>

            </div>
            <div class="editorjs" id="editorjs"></div>
            <button id="guardar-btn">Guardar Proyecto</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@editorjs/header@latest"></script>
    <script type="module" src="scripts/pages/NewProject.js"></script>
</body>
</html>
