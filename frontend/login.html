<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLog - Iniciar sesión</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <nav>
            <div class="app-title"><a href="index.html">WorkLog</a></div>
            <ul class="nav-link">
                <li><a href="index.html">Explorar</a></li>
                <li>Favoritos</li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">&lt;/&gt;</div>
                <h1>Inicia sesión en WorkLog</h1>
                <p>Ingresa tus credenciales para acceder a tus proyectos</p>
            </div>

            <!-- Alerta de error (Oculta por defecto) -->
            <div id="error-message" class="auth-error hidden">
                Usuario o contraseña incorrectos.
            </div>

            <form id="auth-form" class="campos-proyecto">
                <div class="grupo-formulario">
                    <label for="username">Usuario o Email</label>
                    <input type="text" id="username" placeholder="tu_usuario" required autocomplete="username">
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="guardar-btn">Iniciar sesión</button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
            </div>
        </section>
    </main>

    <script src="scripts/auth.js"></script>
</body>
</html>
