<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkLog - Crear cuenta</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <nav>
            <div class="app-title"><a href="index.html">WorkLog</a></div>
            <ul class="nav-link">
                <li><a href="index.html">Explorar</a></li>
                <li>Favoritos</li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">&lt;/&gt;</div>
                <h1>Crea tu cuenta en WorkLog</h1>
                <p>Únete para publicar y organizar tus proyectos informáticos</p>
            </div>

            <!-- Alerta de error dinámico -->
            <div id="error-message" class="auth-error hidden"></div>

            <form id="auth-form" class="campos-proyecto">
                <div class="grupo-formulario">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" placeholder="ej. janmante" required autocomplete="username">
                </div>

                <div class="grupo-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="usuario@ejemplo.com" required autocomplete="email">
                </div>

                <div class="grupo-formulario">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>

                <div class="grupo-formulario">
                    <label for="confirm-password">Confirmar contraseña</label>
                    <input type="password" id="confirm-password" placeholder="Repite tu contraseña" required autocomplete="new-password">
                </div>

                <button type="submit" id="guardar-btn">Crear cuenta</button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </section>
    </main>

    <script src="scripts/register.js"></script>
</body>
</html>
